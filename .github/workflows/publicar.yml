name: Publicar en Facebook e Instagram

on:
  schedule:
    # Objetivo: 5 a.m. en Houston (10:00 UTC en verano, 11:00 UTC en invierno). GitHub suele arrancar
    # los programados con horas de retraso, así que hay varios intentos en minutos poco congestionados.
    # run.py publica en el primer intento desde las 5 a.m. del día que toca (cada 3 días) y los demás se saltan.
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
    - cron: "41 13 * * *"
    - cron: "41 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run genera la imagen sin publicar; publish publica ahora"
        type: choice
        default: dry-run
        options: [dry-run, publish]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Publicar
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PAGE_ID: ${{ vars.PAGE_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
        run: python run.py
